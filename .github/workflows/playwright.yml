name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Run API tests
        run: npx playwright test --project=api
        env:
          EVENTHUB_EMAIL: ${{ secrets.EVENTHUB_EMAIL }}
          EVENTHUB_PASSWORD: ${{ secrets.EVENTHUB_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  newman:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Run Postman collection
        run: >
          npx newman run postman/eventhub.postman_collection.json
          -e postman/eventhub.postman_environment.json
          --env-var "email=$EVENTHUB_EMAIL"
          --env-var "password=$EVENTHUB_PASSWORD"
          -r cli,htmlextra
          --reporter-htmlextra-export newman/report.html
        env:
          EVENTHUB_EMAIL: ${{secrets.EVENTHUB_EMAIL}}
          EVENTHUB_PASSWORD: ${{ secrets.EVENTHUB_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: newman-report
          path: newman/
          retention-days: 30
